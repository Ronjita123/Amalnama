<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Amalnama - আমলনামা</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8f5;
      color: #173b2b;
    }

    header {
      background: linear-gradient(135deg, #0d5138, #1b7653);
      color: white;
      padding: 28px 20px;
      text-align: center;
      border-radius: 0 0 30px 30px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 22px;
      border-radius: 20px;
      margin-top: -5px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
      text-align: center;
    }

    .welcome h2 {
      color: #125b3e;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #64756d;
      line-height: 1.7;
    }

    .section-title {
      margin: 30px 0 15px;
      font-size: 23px;
      color: #125b3e;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .card h3 {
      color: #145c40;
      margin-bottom: 7px;
    }

    .card p {
      color: #718078;
      font-size: 14px;
      line-height: 1.5;
    }

    .amal-card {
      background: linear-gradient(135deg, #e5f6ed, #ffffff);
      border: 1px solid #cce9da;
    }

    .progress-box {
      background: white;
      padding: 22px;
      border-radius: 20px;
      margin-top: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #e4ebe7;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress {
      width: 35%;
      height: 100%;
      background: #168157;
      border-radius: 20px;
    }
